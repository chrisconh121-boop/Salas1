kind = "web"
previewPath = "/"
title = "FarmCity"
description = "A pixel-art social farming world where players create avatars, explore a shared plaza, chat, and meet other players."
version = "1.0.0"
id = "artifacts/farmcity"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23739

[services.development]
run = "pnpm --filter @workspace/farmcity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farmcity", "run", "build" ]
serve = "static"
publicDir = "artifacts/farmcity/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23739"
BASE_PATH = "/"
